[workspace]
name = "greaselm-medqa-training"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.8.*"
pip = "*"

[pypi-dependencies]
transformers = "==3.4.0"
wandb = "==0.12.21"
tensorboardX = "==2.5.1"
protobuf = "==3.20.1"
numpy = "==1.18.5"
scipy = "==1.5.4"
torch-geometric = "==1.7.0"
networkx = "==2.5"
scikit-learn = "==0.24.2"
nltk = "==3.6.7"
googledrivedownloader = "==0.4"
gdown = "==4.7.3"
tqdm = "==4.66.5"

[target.win-64.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/cpu/torch-1.8.0%2Bcpu-cp38-cp38-win_amd64.whl" }
torch-scatter = { url = "https://data.pyg.org/whl/torch-1.8.0%2Bcpu/torch_scatter-2.0.7-cp38-cp38-win_amd64.whl" }
torch-sparse = { url = "https://data.pyg.org/whl/torch-1.8.0%2Bcpu/torch_sparse-0.6.9-cp38-cp38-win_amd64.whl" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-1.8.0%2Bcpu/torch_cluster-1.5.9-cp38-cp38-win_amd64.whl" }
torch-spline-conv = { url = "https://data.pyg.org/whl/torch-1.8.0%2Bcpu/torch_spline_conv-1.2.1-cp38-cp38-win_amd64.whl" }

[target.linux-64.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/cpu/torch-1.8.0%2Bcpu-cp38-cp38-linux_x86_64.whl" }
torch-scatter = { url = "https://data.pyg.org/whl/torch-1.8.0%2Bcpu/torch_scatter-2.0.7-cp38-cp38-linux_x86_64.whl" }
torch-sparse = { url = "https://data.pyg.org/whl/torch-1.8.0%2Bcpu/torch_sparse-0.6.9-cp38-cp38-linux_x86_64.whl" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-1.8.0%2Bcpu/torch_cluster-1.5.9-cp38-cp38-linux_x86_64.whl" }
torch-spline-conv = { url = "https://data.pyg.org/whl/torch-1.8.0%2Bcpu/torch_spline_conv-1.2.1-cp38-cp38-linux_x86_64.whl" }

[tasks]
smoke = "python -u reproduce.py --train-count 2 --eval-count 1 --epochs 1 --micro-batch 1 --auto-sequence-length"
reproduce = "python -u reproduce.py"
