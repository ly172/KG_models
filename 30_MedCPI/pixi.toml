[workspace]
name = "medcpi-real-mimic4"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.11.*"

[pypi-dependencies]
torch = { version = "==2.5.1+cpu", index = "https://download.pytorch.org/whl/cpu" }
numpy = "==1.26.4"
scikit-learn = "==1.5.2"
transformers = "==4.46.3"
huggingface-hub = "==0.26.5"
duckdb = "==1.5.0"
rdflib = "==7.1.4"

[tasks]
smoke = "python smoke.py"
prepare-cohort = "python prepare_cohort.py"
reproduce = "python reproduce.py"
